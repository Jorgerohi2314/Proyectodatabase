services:
  # Aplicación web (SQLite). Los datos viven en /app/prisma/production.db.
  # NO se sube ninguna BD al repo: los 119 usuarios se copian al homelab por scp/rsync
  # a ./datos/web_gestion/production.db y se montan como bind-mount.
  web_gestion:
    build: ./
    container_name: web_gestion
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Corremos como root para poder escribir el bind-mount del host sin problemas de UID.
    user: "0:0"
    environment:
      # Ruta absoluta para evitar ambigüedad de resolución relativa en contenedores
      - DATABASE_URL=file:/app/prisma/production.db
    volumes:
      # BD persistente del host (copiada por scp/rsync). El entrypoint crea el esquema
      # si el archivo está vacío.
      - ./datos/web_gestion/production.db:/app/prisma/production.db
